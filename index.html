<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DE BLACK | Офіційний магазин</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica', Arial, sans-serif;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 1px solid #1a1a1a;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
            padding: 0;
            margin: 0;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #888;
        }

        .cart-icon {
            display: flex;
            align-items: center;
            font-size: 12px;
        }

        .tg-link {
            color: #24A1DE !important;
            text-decoration: none;
            font-weight: bold;
            margin-right: 15px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: clamp(40px, 8vw, 80px);
            margin: 0;
            letter-spacing: 10px;
        }

        .hero p {
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            padding: 40px 5%;
        }

        .product-card {
            text-align: center;
            background: #050505;
            padding: 30px;
            border: 1px solid #111;
            transition: 0.3s;
        }

        .product-card:hover {
            border-color: #333;
        }

        .product-card img {
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            display: block;
        }

        .product-card h3 {
            font-size: 16px;
            margin: 15px 0 5px;
        }

        .price {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .buy-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background: #cccccc;
        }

        footer {
            text-align: center;
            padding: 60px 20px;
            color: #333;
            font-size: 10px;
            border-top: 1px solid #1a1a1a;
        }
    </style>
</head>
